[trainer-qwen]
pretrained_model_name=Qwen/Qwen3-1.7B-Base
max_steps=50000
learning_rate=5e-5
logging_dir=./log
output_dir=./checkpoint
run_name=vilegalqwen
data_seed=42
dataloader_num_workers=16
do_train=True
do_eval=True
evaluation_strategy=steps
eval_steps=500
fp16=False
bf16=True
gradient_accumulation_steps=4
log_level=info
logging_strategy=steps
logging_steps=100
lr_scheduler_type=cosine
per_device_train_batch_size=8
per_device_eval_batch_size=8
prediction_loss_only=True
report_to=wandb
save_strategy=steps
save_steps=1000
save_total_limit=3
seed=42
warmup_ratio=0.1
warmup_steps=1000
weight_decay=0.01
max_seq_length=2048